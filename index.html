<style>
/* طراحی: مرکز فرماندهی؛ سرمه‌ای عمیق با لبه‌های آبی روشن و طلایی کم‌رنگ برای نشان ریاست‌جمهوری */
:root {
  --bg: #0b1426;
  --bg2: #0f1c36;
  --card: #14223f;
  --card2: #1b2d52;
  --line: #2a3f6a;
  --fg: #eaf0fb;
  --fg2: #a4b4d2;
  --fg3: #6f84ab;
  --accent: #4f9bff;
  --accent-fg: #06142b;
  --gold: #f0c36a;
  --good: #35d19a;
  --bad: #ff6b7d;
  --warn: #ffb454;
  --shadow: 0 8px 24px rgba(0, 0, 0, .35);
  --land: #2f4a7c;
  --sea: #0c1830;
  --font: 'Vazirmatn', 'Vazir', 'Noto Naskh Arabic', Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef2fa; --bg2: #e3eaf7; --card: #ffffff; --card2: #eaf0fb; --line: #cbd7ee; --fg: #0d1b36; --fg2: #46597f; --fg3: #7487ab;
  --accent: #1f6fe0; --accent-fg: #ffffff; --gold: #b07a14; --good: #0f9d6b; --bad: #d1344a; --warn: #c4720a; --shadow: 0 6px 18px rgba(20, 40, 90, .12);
  --land: #aebddb; --sea: #dfe8f7; color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6;
  padding-block: 0; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tn { font-variant-numeric: tabular-nums; }
#app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); min-height: 0; scrollbar-width: thin; }
.view { animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* سربرگ */
.hero {
  position: relative; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 14px max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(180deg, var(--card2) 0%, var(--bg) 100%); flex: none;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 800; letter-spacing: .14em; font-size: 13px; color: var(--fg2); direction: ltr; }
.brand b { color: var(--gold); letter-spacing: .2em; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 17px; padding: 0; }
.iconbtn:active { transform: scale(.94); }
.country { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.country h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 800; }
.sub { color: var(--fg2); font-size: 13px; margin-top: 2px; }
.flag { display: inline-grid; place-items: center; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--fg2); }

/* کارت‌ها */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.card + .card, .stack > * + * { margin-top: 12px; }
.card h3, .h { margin: 0 0 10px; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.h { font-size: 13px; color: var(--fg2); font-weight: 700; margin: 18px 2px 8px; letter-spacing: 0; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--fg2); display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 19px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .d { font-size: 11.5px; margin-top: 2px; }
.kpi .d:empty { display: none; }
.up { color: var(--good); } .dn { color: var(--bad); } .warn { color: var(--warn); } .mut { color: var(--fg3); }
.bar { height: 8px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .5s ease; }
.bar.g > i { background: var(--good); } .bar.r > i { background: var(--bad); } .bar.y > i { background: var(--warn); }
.cashrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cash { border-radius: 16px; padding: 12px; border: 1px solid var(--line); background: var(--card); }
.cash.in { box-shadow: inset 0 -3px 0 var(--good); } .cash.out { box-shadow: inset 0 -3px 0 var(--bad); }

/* کاشی‌های اصلی */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 96px; justify-content: center; font-weight: 700; font-size: 14px; position: relative; transition: transform .12s, background .2s, border-color .2s; }
.tile:active { transform: scale(.96); background: var(--card2); }
.tile .ic { font-size: 30px; line-height: 1; }
.tile .bd { position: absolute; top: 8px; left: 8px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.tile .bd.b { background: var(--accent); color: var(--accent-fg); }

/* نوار پایین */
.dock { flex: none; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(0deg, var(--bg) 70%, transparent); display: flex; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; font-size: 15px; background: var(--card2); color: var(--fg); border: 1px solid var(--line); transition: transform .1s, opacity .2s; min-height: 46px; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.gold { background: var(--gold); color: #1d1503; border-color: transparent; }
.btn.bad { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 6px 12px; min-height: 34px; font-size: 13px; border-radius: 11px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.wide { flex: 1; }
.endturn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }

/* صفحات داخلی */
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); }
.top h2 { margin: 0; font-size: 19px; font-weight: 800; flex: 1; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--fg2); border-radius: 99px; padding: 6px 14px; font-size: 13px; font-weight: 700; min-height: 36px; }
.tab.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.row { display: flex; align-items: center; gap: 10px; }
.row.sp { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.kv:last-child { border: 0; }
.kv span:first-child { color: var(--fg2); }
.step { display: flex; align-items: center; gap: 8px; }
.step button { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); background: var(--card2); font-size: 18px; font-weight: 800; padding: 0; }
.step button:active { transform: scale(.9); }
.step b { min-width: 58px; text-align: center; font-size: 15px; }
.note { font-size: 12.5px; color: var(--fg3); }
.chip { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--card2); color: var(--fg2); }
.chip.good { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.chip.bad { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
.chip.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.chip.acc { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.list > * + * { margin-top: 10px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.item .t { font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--card2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stat .l { font-size: 11.5px; color: var(--fg2); } .stat .v { font-weight: 800; font-size: 14px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg3); font-size: 9px; font-family: var(--font); }
.chart .grid { stroke: var(--line); stroke-width: .6; stroke-dasharray: 2 3; }
.empty { text-align: center; color: var(--fg3); padding: 28px 10px; }
.news { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.news:last-child { border: 0; }
.news i { width: 4px; border-radius: 4px; background: var(--fg3); flex: none; }
.news.good i { background: var(--good); } .news.bad i { background: var(--bad); }
.news .t { font-weight: 800; font-size: 14px; } .news .x { font-size: 13px; color: var(--fg2); margin-top: 1px; }

/* انتخاب کشور */
.cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ccard { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; text-align: right; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ccard.on { border-color: var(--accent); background: var(--card2); }
.dots { display: inline-flex; gap: 3px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--warn); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 700; color: var(--fg2); }
.input { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--fg); font-family: inherit; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }

/* نقشه */
.mapbox { background: var(--sea); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; position: relative; }
.mapscroll { overflow-x: auto; direction: ltr; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.mapbox svg { display: block; width: 100%; min-width: 760px; height: auto; }
.mapbox .land { fill: none; stroke: var(--land); stroke-width: 3.2; stroke-linecap: round; }
.mk { cursor: pointer; }
.mk text { font-size: 21px; fill: var(--fg); font-weight: 800; paint-order: stroke; stroke: var(--sea); stroke-width: 3px; font-family: var(--font); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--fg2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }

/* پنجره‌ها */
.scrim { position: absolute; inset: 0; background: rgba(3, 8, 20, .66); display: flex; align-items: flex-end; z-index: 20; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); animation: up .26s ease both; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: -8px auto 12px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; box-shadow: var(--shadow); font-size: 14px; font-weight: 700; animation: up .22s ease both; text-align: center; }
.toast.bad { border-color: var(--bad); } .toast.good { border-color: var(--good); }
.splash { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px max(20px, env(safe-area-inset-left, 0px)); gap: 14px; background: radial-gradient(120% 70% at 50% 0%, var(--card2), var(--bg) 70%); overflow: auto; }
.logo { font-size: 44px; font-weight: 900; letter-spacing: .18em; direction: ltr; text-align: center; margin: 0; }
.logo span { color: var(--gold); }
.seal { font-size: 54px; text-align: center; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.lv { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; padding: 5px 0; }
.err { background: color-mix(in srgb, var(--bad) 16%, var(--card)); border: 1px solid var(--bad); border-radius: 14px; padding: 12px; margin: 12px; font-size: 13px; }

</style>
</head>

  const pkey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);

  /* ───────── وزیران ───────── */
  const effic = (m) => 0.6 + ((m.skill * 0.7 + m.integrity * 0.3) / 100) * 0.8;
  const xof = (m) => effic(m) - 1; // بین حدود -۰٫۲۵ تا +۰٫۴

  function genMinister(w, c, ministry, bonus) {
    const nm = P.NAMES[c.culture] || P.NAMES.ir;
    return {
      id: 'm' + w.uid++,
      ministry,
      name: pick(w, nm.f) + ' ' + pick(w, nm.l),
      skill: clamp(Math.round(35 + rnd(w) * 50 + (bonus || 0)), 20, 98),
      integrity: clamp(Math.round(30 + rnd(w) * 60), 15, 98),
      trait: pick(w, P.TRAITS),
    };
  }
  const hireCost = (c, m) => r2(0.1 * c.scale * (0.5 + m.skill / 100));

  function ministerFx(c) {
    const m = c.ministers;
    const x = {};
    P.MINISTRIES.forEach((k) => (x[k.id] = xof(m[k.id])));
    const integ = P.MINISTRIES.reduce((s, k) => s + m[k.id].integrity, 0) / P.MINISTRIES.length;
    return {
      x,
      coll: x.economy * 0.2 + ((integ - 50) / 100) * 0.1,
      infl: -2 * x.economy,
      industry: 1 + 0.5 * x.industry,
      costMul: 1 - 0.3 * x.industry,
      sec: 20 * x.defense,
      relMul: 1 + 0.6 * x.foreign,
      trade: 0.3 * x.foreign,
      mood: 6 * x.interior,
      stabU: x.interior,
      energySup: 0.1 * x.energy,
      edu: 15 * x.education,
      health: 15 * x.health,
      integ,
    };
  }

  function techFx(c) {
    const o = { industry: 0, coll: 0, energy: 0, trade: 0, health: 0, edu: 0, sec: 0, growth: 0, uNat: 0, infl: 0, cur: 0, infra: 0, mood: 0, food: 0, power: 0, greenSens: 0 };
    for (const id of c.tech) {
      const t = P.TECH[id];
      for (const k in t.fx) o[k] += t.fx[k];
    }
    return o;
  }

  const modSum = (c, key) => c.mods.reduce((s, m) => (m.key === key ? s + m.val : s), 0);
  const govRate = (c) => clamp(0.25 * c.policy + 0.6 + Math.max(0, c.debt / Math.max(1, c.gdp) - 1.5) * 0.8 + (c.infl - c.inf0) * 0.1, 0.3, 40);
  const alliesOf = (w, id) => {
    const out = [];
    for (const k in w.pacts) {
      const p = w.pacts[k];
      if (p.alliance && (p.a === id || p.b === id)) out.push(p.a === id ? p.b : p.a);
    }
    return out;
  };

  /* ───────── ساختمان‌ها / پروژه‌ها ───────── */
  function bStats(c, w, tf, mf) {
    const s = { out: 0, rev: 0, up: 0, jobs: 0, energy: 0, health: 0, edu: 0, infra: 0, portBoost: 0, uni: 0, count: 0 };
    const sc = c.scale;
    const jobScale = Math.pow(c.pop / 100, 0.9);
    const dil = clamp(1.2 / sc, 0.25, 1.5);
    for (const b of c.buildings) {
      if (!b.active) continue;
      const d = P.BDEF[b.def];
      let m = mf.industry * (1 + tf.industry);
      if (b.def === 'food') m *= 1 + tf.food;
      if (b.def === 'power') m *= 1 + tf.power;
      if (b.def === 'electronics') m *= 0.7 + (0.6 * c.lv.edu) / 100;
      let rev = d.rev * sc * m;
      if (b.def === 'refinery') rev *= w.energyPrice;
      s.out += d.out * sc * m;
      s.rev += rev;
      s.up += d.up * sc;
      s.jobs += d.jobs * jobScale;
      s.energy += (d.energy || 0) * sc;
      s.portBoost += d.portBoost || 0;
      s.uni += d.uni || 0;
      s.count++;
      if (d.lv) for (const k in d.lv) s[k] += d.lv[k] * dil;
    }
    s.health = Math.min(s.health, 35);
    s.edu = Math.min(s.edu, 35);
    s.infra = Math.min(s.infra, 35);
    return s;
  }
  const buildCost = (c, defId) => {
    const d = P.BDEF[defId];
    return r2(d.cost * c.scale * ministerFx(c).costMul);
  };

  /* ───────── محاسبه شاخص‌های مشتق‌شده ───────── */
  function tradeOf(c, w, tf, mf) {
    let X = 0, M = 0, vol = 0, tariffRev = 0;
    const partners = [];
    for (const k in w.pacts) {
      const p = w.pacts[k];
      if ((p.a !== c.id && p.b !== c.id) || !p.trade || p.sanction) continue;
      const o = w.countries[p.a === c.id ? p.b : p.a];
      const relF = clamp((w.rel[k] + 20) / 80, 0.2, 1.4);
      let v = 0.004 * Math.sqrt(c.gdp * o.gdp) * (1 + (p.agreement ? 0.8 : 0)) * (1 + (p.alliance ? 0.25 : 0)) * relF * (1 + tf.trade) * (1 + mf.trade);
      v = Math.min(v, Math.min(c.gdp, o.gdp) * 0.08);
      const mine = p.tariff.includes(c.id);
      const theirs = p.tariff.includes(o.id);
      const xs = (v / 2) * Math.pow(100 / c.cur, 0.5) * (theirs ? 0.6 : 1);
      const ms = (v / 2) * Math.pow(100 / o.cur, 0.5) * (mine ? 0.6 : 1);
      if (mine) tariffRev += ms * 0.12;
      X += xs; M += ms; vol += v;
      partners.push({ id: o.id, x: xs, m: ms, v });
    }
    return { X, M, vol, tariffRev, partners };
  }

  function derive(c, w) {
    const tf = techFx(c), mf = ministerFx(c);
    const bs = bStats(c, w, tf, mf);
    const allies = alliesOf(w, c.id).length;
    const eff = {
      health: clamp(c.lv.health + bs.health + mf.health + tf.health, 0, 100),
      edu: clamp(c.lv.edu + bs.edu + mf.edu + tf.edu, 0, 100),
      infra: clamp(c.lv.infra + bs.infra + tf.infra, 0, 100),
      sec: clamp(c.lv.sec + mf.sec + tf.sec + Math.min(9, allies * 3), 0, 100),
    };
    const welfareRatio = c.bud.welfare / c.bud0.welfare;
    const consShare = clamp(
      c.cons - (c.tax - c.tax0) * 0.55 + ((c.appr - c.appr0) / 100) * 0.1 - Math.max(0, c.infl - Math.max(10, c.inf0)) * 0.002 + (welfareRatio - 1) * 0.03,
      0.25, 0.8);
    const tr = tradeOf(c, w, tf, mf);
    const baseX = c.gdp * c.expS * Math.pow(100 / c.cur, 0.5) * (1 + tf.trade * 0.5 + bs.portBoost) * (1 + modSum(c, 'export'));
    const baseM = c.gdp * c.impS * Math.pow(c.cur / 100, 0.5) * (1 + (consShare - c.cons) * 1.5);
    const X = baseX + tr.X, M = baseM + tr.M;
    const demand = c.demand0 * Math.pow(c.gdp / c.gdp0, 0.8);
    const supply = (c.supply0 * (1 + (0.012 * w.turn) / 12) + bs.energy) * (1 + mf.energySup) + tf.energy * c.demand0;
    const energyRatio = supply / demand;
    const d = {
      tf, mf, bs, eff, consShare, cons: c.gdp * consShare, X, M, net: X - M, netRatio: (X - M) / c.gdp,
      tradeVol: tr.vol, tariffRev: tr.tariffRev, partners: tr.partners,
      prod: c.gdp * c.ind + bs.out,
      demand, supply, energyRatio,
      debtRatio: c.debt / c.gdp,
      govRate: govRate(c),
      allies,
    };
    c.d = d;
    return d;
  }

  /* ───────── مالی دولت (یک ماه) ───────── */
  function fiscal(c, w, d) {
    d = d || c.d || derive(c, w);
    const g = c.gdp / 12;
    const coll = clamp(c.collBase + d.mf.coll + d.tf.coll, 0.55, 1.05);
    const rev = {
      tax: g * c.tax * coll,
      oil: g * c.oil * w.energyPrice,
      other: g * (c.other / 100),
      state: d.bs.rev,
      tariff: d.tariffRev / 12,
    };
    const exp = {};
    P.BUDGET.forEach((b) => (exp[b.id] = (g * c.bud[b.id]) / 100));
    exp.admin = (g * c.admin) / 100;
    exp.interest = (c.debt * d.govRate) / 100 / 12;
    exp.upkeep = d.bs.up;
    const income = Object.values(rev).reduce((s, v) => s + v, 0);
    const expense = Object.values(exp).reduce((s, v) => s + v, 0);
    return { rev, exp, income, expense, balance: income - expense, coll };
  }

  /* ───────── ساخت کشور ───────── */
  function buildCountry(s, w) {
    const c = {
      id: s.id, name: s.name, flag: s.flag || '🏳️', flagSvg: s.flagSvg || null, lon: s.lon, lat: s.lat, culture: s.culture || 'ir', bloc: s.bloc || 'N', personality: s.personality || 'balanced',
      custom: !!s.custom, owner: null, desc: s.desc || '',
      pop: s.pop, gdp: s.gdp, gdp0: s.gdp, tax: s.tax, tax0: s.tax, infl: s.infl, inf0: s.infl, unemp: s.unemp, u0: s.unemp, appr: s.appr, appr0: s.appr,
      debt: s.debt, treasury: s.treasury, deficit0: s.deficit, g0: s.g0, expS: s.exp, impS: s.imp, oil: s.oil || 0, other: s.other == null ? 1 : s.other, edep: s.edep || 0,
      cons: s.cons, ind: s.ind, collBase: s.coll == null ? 0.9 : s.coll, policy: s.policy, policy0: s.policy, cur: 100, cur0: 100,
      lv: { ...s.lv }, lv0: { ...s.lv }, bud: { ...s.bud }, bud0: { ...s.bud },
      buildings: [], projects: [], tech: [], research: { cur: null, progress: 0 }, rp: 0, uniCount: 0,
      mods: [], mood: 0, cool: {}, monetized: 0, lowAppr: 0, jobsApplied: 0, bOutApplied: 0, term: 1, netRatio0: 0, vol0: 0,
      ytd: { rev: 0, exp: 0, start: 0 }, m: null, d: null,
    };
    c.scale = clamp(Math.pow(c.gdp / 1500, 0.65), 0.3, 8);
    c.ministers = {}; c.candidates = {};
    P.MINISTRIES.forEach((k) => {
      c.ministers[k.id] = genMinister(w, c, k.id, 0);
      c.candidates[k.id] = [genMinister(w, c, k.id, 5), genMinister(w, c, k.id, 0), genMinister(w, c, k.id, 10)];
    });
    // بودجه اداری طوری تنظیم می‌شود که کسری اولیه برابر مقدار هدف کشور باشد
    const coll0 = clamp(c.collBase + ministerFx(c).coll, 0.55, 1.05);
    const sumCats = Object.values(c.bud).reduce((a, b) => a + b, 0);
    const total = c.tax * 100 * coll0 + c.oil * 100 + c.other + s.deficit;
    const intPct = (c.debt / c.gdp) * govRate(c);
    c.admin = r2(Math.max(1, total - sumCats - intPct));
    c.admin0 = c.admin;
    c.demand0 = c.gdp / 100;
    c.supply0 = c.demand0 * (s.eRatio || 1.03);
    c.hist = { gdp: [], infl: [], unemp: [], appr: [], treasury: [], debt: [], cur: [], income: [], expense: [] };
    return c;
  }

  function customSpec(o, w) {
    const a = P.ARCHETYPES.find((x) => x.id === o.arch) || P.ARCHETYPES[0];
    const sz = P.SIZES.find((x) => x.id === o.size) || P.SIZES[1];
    const rg = P.REGIONS.find((x) => x.id === o.region) || P.REGIONS[0];
    const pop = sz.pop;
    const gdp = Math.max(20, Math.round((pop * a.gdpPC) / 1000));
    const tax = a.tax, oil = a.oil, other = 1.5;
    const total = tax * 100 + oil * 100 + other + a.deficit;
    const sh = { health: 0.17, edu: 0.16, def: 0.09, infra: 0.13, welfare: 0.25, research: 0.03 };
    const bud = {};
    for (const k in sh) bud[k] = r2(total * sh[k]);
    return {
      id: 'CUS', name: (o.name || 'کشور من').trim().slice(0, 24) || 'کشور من', flag: '🏳️', flagSvg: o.flag, lon: rg.lon, lat: rg.lat, culture: 'ir', bloc: 'N', personality: a.id === 'oil' ? 'resource' : a.id === 'industrial' ? 'industrial' : 'balanced',
      custom: true, pop, gdp, tax, infl: a.infl, unemp: a.unemp, appr: a.appr, debt: Math.round(gdp * a.debtR), treasury: Math.round(gdp * 0.08), deficit: a.deficit,
      g0: a.g0, exp: a.exp, imp: a.imp, oil, other, edep: oil > 0 ? 0 : 0.02, cons: 0.55, ind: a.ind, coll: 0.88, policy: Math.max(2, a.infl * 1.8), eRatio: 1.03,
      bud, lv: { health: a.lv[0], edu: a.lv[1], infra: a.lv[2], sec: a.lv[3] },
      desc: 'کشور ساخته‌شده توسط شما با الگوی «' + a.name + '».',
    };
  }

  /* ───────── اخبار ───────── */
  function news(w, n) {
    w.news.unshift({ id: w.uid++, turn: w.turn, cat: n.cat || 'world', tone: n.tone || 'neutral', title: n.title, text: n.text || '', cid: n.cid || null });
    if (w.news.length > 160) w.news.length = 160;
  }

  /* ───────── دیپلماسی ───────── */
  function ensurePact(w, a, b) {
    const k = pkey(a, b);
    if (!w.pacts[k]) { const [x, y] = a < b ? [a, b] : [b, a]; w.pacts[k] = { a: x, b: y, ties: false, trade: false, agreement: false, alliance: false, rival: null, sanction: false, tariff: [] }; }
    if (w.rel[k] == null) w.rel[k] = 0;
    return w.pacts[k];
  }
  const getRel = (w, a, b) => w.rel[pkey(a, b)] || 0;
  function addRel(w, a, b, d) { const k = pkey(a, b); w.rel[k] = clamp((w.rel[k] || 0) + d, -100, 100); }

  const LEVELS = ['none', 'ties', 'trade', 'agreement', 'alliance'];
  const pactLevel = (p) => (p.alliance ? 4 : p.agreement ? 3 : p.trade ? 2 : p.ties ? 1 : 0);
  function setLevel(p, lvl) {
    p.ties = lvl >= 1; p.trade = lvl >= 2; p.agreement = lvl >= 3; p.alliance = lvl >= 4;
    if (lvl < 2) { p.tariff = []; p.sanction = false; }
  }

  const REQ = { ties: -30, trade: 0, agreement: 25, alliance: 50 };
  function applyPact(w, a, b, type) {
    const p = ensurePact(w, a, b);
    const target = LEVELS.indexOf(type);
    if (pactLevel(p) < target) setLevel(p, target);
    addRel(w, a, b, type === 'ties' ? 4 : type === 'trade' ? 3 : type === 'agreement' ? 5 : 8);
    p.sanction = false;
    p.rival = null;
    if (type === 'alliance') {
      for (const id in w.countries) {
        if (id === a || id === b) continue;
        if (getRel(w, a, id) < -30) addRel(w, b, id, -8);
        if (getRel(w, b, id) < -30) addRel(w, a, id, -8);
      }
    }
  }

  const TYPE_NAME = { ties: 'روابط دیپلماتیک', trade: 'توافق تجاری', agreement: 'توافق اقتصادی', alliance: 'اتحاد' };

  /* ───────── رویدادها ───────── */
  function addMod(c, key, val, left) { c.mods.push({ key, val, left }); }

  const GLOBAL_EVENTS = [
    {

  /* رویدادهای کشور بازیکن؛ choices: [{label, desc, run(c,w) → متن نتیجه}] */

        { label: 'فروش ذخایر', desc: (c) => 'هزینه ' + fm(c.gdp * 0.008), run(c) { c.treasury -= c.gdp * 0.008; c.cur *= 0.98; return 'ذخایر ارزی خرج دفاع از پول ملی شد.'; } },
        { label: 'اجازه افت', desc: () => 'بدون هزینه', run(c) { c.cur *= 0.88; addMod(c, 'infl', 1.2, 6); return 'ارز ۱۲٪ افت کرد.'; } },

  ];
  P.COUNTRY_EVENTS = COUNTRY_EVENTS;

  function fm(b) {
    if (Math.abs(b) >= 1000) return r2(b / 1000) + ' تریلیون دلار';
    if (Math.abs(b) >= 1) return r2(b) + ' میلیارد دلار';
    return Math.round(b * 1000) + ' میلیون دلار';
  }

  function rollEvents(w) {
    // رویداد جهانی
    if (rnd(w) < 0.12) {
      const total = GLOBAL_EVENTS.reduce((s, e) => s + e.w, 0);
      let r = rnd(w) * total;
      for (const e of GLOBAL_EVENTS) { r -= e.w; if (r <= 0) { e.run(w); break; } }
    }
    // رویداد کشورهای بازیکن
    for (const pl of w.players) {
      const c = w.countries[pl.countryId];
      if (rnd(w) > 0.5) continue;
      const elig = COUNTRY_EVENTS.filter((e) => !(c.cool[e.id] > w.turn) && e.weight(c) > 0);
      const total = elig.reduce((s, e) => s + e.weight(c), 0);
      if (!total) continue;
      let r = rnd(w) * total, ev = elig[0];
      for (const e of elig) { r -= e.weight(c); if (r <= 0) { ev = e; break; } }
      c.cool[ev.id] = w.turn + ev.cool;
      if (ev.auto) {
        const msg = ev.run(c, w);
        news(w, { cat: 'event', tone: 'good', cid: c.id, title: ev.title, text: ev.text + ' ' + msg });
      } else {
        w.pending.push({ id: w.uid++, ev: ev.id, cid: c.id, turn: w.turn });
      }
    }
    // نوسانات تصادفی اقتصاد کشورهای هوش مصنوعی
    for (const id in w.countries) {
      const c = w.countries[id];
      if (c.owner) continue;
      if (rnd(w) < 0.04) addMod(c, 'growth', (rnd(w) < 0.5 ? -1 : 1) * 0.0008, 4);
    }
  }

  /* ───────── هوش مصنوعی کشورها ───────── */
  function aiMonth(c, w) {
    const monthly = c.m ? c.m.expense : (c.gdp / 12) * 0.3;
    // مالیات
    if (c.d.debtRatio > 1.0 && c.appr > 50 && c.tax < c.tax0 + 0.06) c.tax += 0.002;
    else if (c.appr < 38 && c.tax > c.tax0 - 0.05) c.tax -= 0.002;
    // نرخ بهره
    if (c.infl > c.inf0 + 3) c.policy = Math.min(c.policy0 + 15, c.policy + 0.5);
    else if (c.infl < Math.max(1, c.inf0 - 3) && c.policy > c.policy0 - 3) c.policy -= 0.5;
    // پژوهش
    if (!c.research.cur) {
      const av = P.TECHS.filter((t) => !c.tech.includes(t.id) && t.req.every((r) => c.tech.includes(r)));
      if (av.length) c.research.cur = pick(w, av).id;
    }
    // ساخت‌وساز
    if (c.projects.length < 2 && c.treasury > monthly * 5 && rnd(w) < 0.14) {
      let opts;
      if (c.d.energyRatio < 1) opts = ['power'];
      else if (c.unemp > c.u0 + 1) opts = ['food', 'car', 'steel'];
      else if (c.personality === 'industrial') opts = ['car', 'electronics', 'steel', 'railway', 'university'];
      else if (c.personality === 'resource') opts = ['refinery', 'power', 'port', 'food'];
      else opts = ['food', 'car', 'airport', 'hospital', 'port', 'electronics'];
      const id = pick(w, opts);
      const cost = buildCost(c, id);
      if (c.treasury > cost * 2) {
        c.treasury -= cost; c.projects.push({ uid: w.uid++, def: id, left: P.BDEF[id].months, total: P.BDEF[id].months, cost });
      }
    }
  }

  function aiDiplomacy(w) {
    const ids = Object.keys(w.countries);
    for (const id of ids) {
      const c = w.countries[id];
      if (c.owner) continue;
      if (rnd(w) > 0.12) continue;
      const oid = pick(w, ids.filter((x) => x !== id));
      const o = w.countries[oid];
      const p = ensurePact(w, id, oid);
      const rel = getRel(w, id, oid);
      const lvl = pactLevel(p);
      let type = null;
      if (lvl === 0 && rel > -30) type = 'ties';
      else if (lvl === 1 && rel > 5 && (c.personality !== 'resource' || rnd(w) < 0.5)) type = 'trade';
      else if (lvl === 2 && rel > 28) type = 'agreement';
      else if (lvl === 3 && rel > 58 && rnd(w) < 0.4) type = 'alliance';
      else if (rel < -35 && lvl >= 2 && rnd(w) < 0.25 && !p.sanction) { p.sanction = true; addRel(w, id, oid, -6); news(w, { cat: 'world', tone: 'bad', cid: o.owner ? oid : null, title: c.name + ' علیه ' + o.name + ' تحریم اعمال کرد', text: 'روابط دو کشور بدتر شد و تجارت آن‌ها متوقف است.' }); continue; }
      else if (rnd(w) < 0.5) { addRel(w, id, oid, rnd(w) < 0.5 ? 1 : -1); continue; }
      if (!type) continue;
      if (o.owner) {
        if (type === 'ties') { applyPact(w, id, oid, 'ties'); news(w, { cat: 'politics', tone: 'good', cid: oid, title: c.name + ' روابط دیپلماتیک برقرار کرد', text: 'سفارتخانه‌ها در دو کشور فعال شدند.' }); }
        else if (!w.offers.some((x) => x.from === id && x.to === oid && x.type === type) && w.offers.length < 8) {
          w.offers.push({ id: w.uid++, from: id, to: oid, type, turn: w.turn, exp: w.turn + 6 });
          news(w, { cat: 'politics', tone: 'good', cid: oid, title: c.name + ' پیشنهاد ' + TYPE_NAME[type] + ' داد', text: 'پیشنهاد را در بخش روابط خارجی بررسی کنید.' });
        }
      } else {
        applyPact(w, id, oid, type);
        if (type !== 'ties' && (type === 'alliance' || type === 'agreement')) news(w, { cat: 'world', tone: 'neutral', title: c.name + ' و ' + o.name + ': ' + TYPE_NAME[type], text: 'دو کشور همکاری خود را رسمی کردند.' });
      }
    }
    // تعدیل: روابط به‌سمت پایه حرکت می‌کنند، رقابت تخریب می‌کند
    for (const k in w.pacts) {
      const p = w.pacts[k];
      let target = p.alliance ? 70 : p.agreement ? 45 : p.trade ? 25 : p.ties ? 5 : getRel(w, p.a, p.b) * 0.9;
      if (p.sanction) target = -50;
      if (p.rival) target = Math.min(target, -40);
      if (p.tariff.length) target -= 15;
      const cur = w.rel[k];
      w.rel[k] = clamp(cur + clamp((target - cur) * 0.03, -1.5, 1.5), -100, 100);
    }
    // پیشنهادهای منقضی
    w.offers = w.offers.filter((o) => o.exp > w.turn);
  }

  /* ───────── گام ماهانه برای یک کشور ───────── */
  function stepCountry(c, w) {
    const prev = { gdp: c.gdp, infl: c.infl, unemp: c.unemp, appr: c.appr, treasury: c.treasury, debt: c.debt, cur: c.cur };
    // ۱) پروژه‌های در دست ساخت
    for (const p of c.projects) p.left--;
    const done = c.projects.filter((p) => p.left <= 0);
    c.projects = c.projects.filter((p) => p.left > 0);
    for (const p of done) {
      c.buildings.push({ uid: p.uid, def: p.def, active: true, built: w.turn });
      news(w, { cat: 'economy', tone: 'good', cid: c.id, title: P.BDEF[p.def].name + ' تکمیل شد', text: 'پروژه به بهره‌برداری رسید.' + (c.owner ? '' : '') });
    }
    c.mods = c.mods.filter((m) => --m.left >= 0);
    c.mood *= 0.9;

    const d = derive(c, w);
    const F = fiscal(c, w, d);

    // ۲) خزانه
    c.treasury += F.income - F.expense;
    c.ytd.rev += F.income; c.ytd.exp += F.expense;
    let emergency = 0;
    if (c.treasury < 0) {
      emergency = -c.treasury; c.debt += emergency; c.treasury = 0;
      const over = clamp((c.debt / c.gdp - 2.6) / 1.4, 0, 1); // چاپ پول فقط در بدهی بسیار بالا
      c.monetized += (emergency / c.gdp) * 100 * over;
    }
    c.monetized *= 0.8;
    // تعدیل خودکار بدهی برای کسری سالانه (در همان ماه: درآمدها شامل می‌شود)

    // ۳) رشد
    const gM = c.g0 / 100 / 12;
    const tf = d.tf, mf = d.mf;
    let g = gM;
    g += ((d.eff.infra - c.lv0.infra) / 50) * 0.001;
    g += ((d.eff.edu - c.lv0.edu) / 50) * 0.0008;
    g += ((d.eff.health - c.lv0.health) / 50) * 0.0004;
    g += (d.consShare - c.cons) * 0.03;
    if (c.tax > 0.45) g -= (c.tax - 0.45) * 0.03;
    g -= clamp(c.infl - c.inf0, -5, 40) * 0.00004;
    g -= (c.policy - c.policy0) * 0.0001;
    if (d.energyRatio < 1) g -= (1 - d.energyRatio) * 0.02;
    g -= c.edep * (w.energyPrice - 1) * 0.015 * (1 - tf.greenSens);
    g += c.oil * (w.energyPrice - 1) * 0.01;
    g += (d.netRatio - c.netRatio0) * 0.05;
    g += ((d.tradeVol - c.vol0) / c.gdp) * 0.05;
    g += tf.growth + modSum(c, 'growth');
    if (d.debtRatio > 1.2) g -= (d.debtRatio - 1.2) * 0.0006;
    // رقابت اقتصادی
    for (const k in w.pacts) {
      const p = w.pacts[k];
      if (p.rival && (p.a === c.id || p.b === c.id)) {
        const o = w.countries[p.a === c.id ? p.b : p.a];
        const og = o.lastG || 0;
        g += (c.lastG || 0) > og ? 0.0003 : -0.0003;
      }
    }
    g += (rnd(w) - 0.5) * 0.0006;
    g = clamp(g, -0.02, 0.02);
    c.lastG = g;
    c.gdp *= 1 + g;
    const bOut = d.bs.out;
    c.gdp += bOut - c.bOutApplied;
    c.bOutApplied = bOut;
    c.pop *= 1 + 0.0004;
    const gAnn = g * 1200;

    // ۴) بیکاری
    const uNat = c.u0 - ((d.eff.edu - c.lv0.edu) * 0.02) - mf.stabU * 1 + tf.uNat + modSum(c, 'uNat');
    const jobsDelta = ((d.bs.jobs - c.jobsApplied) / (c.pop * 450)) * 100 * 5;
    c.jobsApplied = d.bs.jobs;
    c.unemp = clamp(c.unemp - 0.035 * (gAnn - c.g0) + 0.02 * (uNat - c.unemp) - jobsDelta, 1.5, 40);

    // ۵) تورم
    const defAnn = ((F.expense - F.income) * 12 / c.gdp) * 100;
    let target = c.inf0
      + (defAnn - c.deficit0) * 0.2
      + (gAnn - c.g0) * 0.12
      + (100 / c.cur - 1) * 6
      + c.edep * 100 * (w.energyPrice - 1) * 0.8 * (1 - tf.greenSens)
      + mf.infl + tf.infl + modSum(c, 'infl')
      - (c.policy - c.policy0) * 0.25
      + c.monetized * 1.5;
    c.infl = clamp(c.infl + 0.18 * (target - c.infl), -2, 250);

    // ۶) ارز
    let dc = 0.08 * (d.netRatio - c.netRatio0) * 100 + 0.03 * (c.policy - c.policy0) + 0.03 * (c.policy0 - 4)
      - 0.06 * (c.infl - w.worldInfl)
      - 0.1 * Math.max(0, d.debtRatio - 1.5) * 10 / 10
      - 0.012 * Math.max(0, 40 - c.appr)
      + (rnd(w) - 0.5) * 0.8;
    if (dc < 0) dc *= 1 - clamp(tf.cur, 0, 0.5);
    c.cur = clamp(c.cur * (1 + dc / 100), 15, 400);

    // ۷) سطح خدمات
    for (const b of P.BUDGET) {
      if (!b.lv) continue;
      const ratio = c.bud[b.id] / c.bud0[b.id];
      const k = b.lv;
      c.lv[k] = clamp(c.lv[k] + (ratio - 1) * 1.5 + (c.lv0[k] - c.lv[k]) * 0.03, 0, 100);
    }

    // ۸) پژوهش
    const rpGain = c.bud.research * 10 * (0.6 + (0.8 * d.eff.edu) / 100) * (1 + 0.15 * d.bs.uni) * 0.1;
    c.rpRate = rpGain;
    if (c.research.cur) {
      c.research.progress += rpGain;
      const t = P.TECH[c.research.cur];
      if (c.research.progress >= t.cost) {
        c.tech.push(t.id); c.research.progress -= t.cost; c.research.cur = null;
        news(w, { cat: 'economy', tone: 'good', cid: c.id, title: 'فناوری «' + t.name + '» فعال شد', text: t.desc });
      }
    } else if (c.research.progress < 1e6) c.research.progress = Math.min(c.research.progress + rpGain * 0.3, 60);

    // ۹) رضایت مردم
    const d2 = derive(c, w);
    const welfareRatio = c.bud.welfare / c.bud0.welfare;
    let ta = c.appr0
      - 1.6 * (c.unemp - c.u0)
      - 0.9 * clamp(c.infl - c.inf0, -10, 30)
      + 0.18 * (d2.eff.health - c.lv0.health) + 0.12 * (d2.eff.edu - c.lv0.edu) + 0.1 * (d2.eff.infra - c.lv0.infra) + 0.08 * (d2.eff.sec - c.lv0.sec)
      - 50 * (c.tax - c.tax0)
      + (welfareRatio - 1) * 12
      - (d2.energyRatio < 1 ? (1 - d2.energyRatio) * 60 : 0)
      - Math.max(0, d2.debtRatio - 1.5) * 10
      + mf.mood + tf.mood + c.mood + modSum(c, 'appr')
      + (gAnn - c.g0) * 1.5;
    ta = clamp(ta, 0, 100);
    c.appr = clamp(c.appr + 0.2 * (ta - c.appr), 2, 98);

    // ۱۰) پایان‌نامه ماهانه
    c.m = { income: F.income, expense: F.expense, balance: F.income - F.expense, rev: F.rev, exp: F.exp, emergency, growthAnn: gAnn, prev };
    const h = c.hist;
    const push = (k, v) => { h[k].push(r2(v)); if (h[k].length > 240) h[k].shift(); };
    push('gdp', c.gdp); push('infl', c.infl); push('unemp', c.unemp); push('appr', c.appr); push('treasury', c.treasury); push('debt', c.debt); push('cur', c.cur); push('income', F.income); push('expense', F.expense);
    if (c.appr < 15) c.lowAppr++; else c.lowAppr = 0;
    derive(c, w);
  }

  /* ───────── نوبت ماهانه ───────── */
  function endTurn(w) {
    if (w.over) return null;
    if (w.pending.length) return { blocked: true };
    const pcs = w.players.map((p) => w.countries[p.countryId]);
    const before = pcs.map((c) => ({ gdp: c.gdp, infl: c.infl, unemp: c.unemp, appr: c.appr, treasury: c.treasury, debt: c.debt, cur: c.cur }));
    const newsStart = w.news.length ? w.news[0].id : 0;

    for (const id in w.countries) { const c = w.countries[id]; if (!c.owner) aiMonth(c, w); }
    for (const id in w.countries) stepCountry(w.countries[id], w);
    aiDiplomacy(w);
    // رقابت منفی
    for (const k in w.pacts) { const p = w.pacts[k]; if (p.rival) addRel(w, p.a, p.b, -1); }
