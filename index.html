      <line class="grid" x1="${L}" x2="${W - R}" y1="${y(mx - pad).toFixed(1)}" y2="${y(mx - pad).toFixed(1)}"/><line class="grid" x1="${L}" x2="${W - R}" y1="${y(mn + pad).toFixed(1)}" y2="${y(mn + pad).toFixed(1)}"/>
      <polygon points="${L},${H - B} ${pts.join(' ')} ${W - R},${H - B}" fill="url(#${id})"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.6" fill="${col}" stroke="var(--card)" stroke-width="1.5"/>
      <text x="${L}" y="9" text-anchor="start">${f(mx - pad)}</text><text x="${L}" y="${H - 4}" text-anchor="start">${f(mn + pad)}</text>
      <text x="${W - R}" y="${H - 4}" text-anchor="end">اکنون: ${f(last)}</text></svg>`;
  }
  const chartCard = (title, vals, o) => `<div class="card"><h3>${title}</h3>${line(vals, o)}</div>`;

  /* ───────── ذخیره ───────── */
  let saveT = null;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(async () => {
      if (!S.w) return;
      try { await P.db.save(S.w); } catch (e) { if (!S.saveWarned) { S.saveWarned = true; toast('ذخیره‌سازی ناموفق بود: ' + (e && e.message || e), false); } }
    }, 250);
  }
  const saveNow = async () => { clearTimeout(saveT); if (S.w) { try { await P.db.save(S.w); return true; } catch (e) { toast('ذخیره‌سازی ناموفق بود', false); return false; } } return false; };
  let toastT = null;
  function toast(msg, ok) { S.toast = { msg: pd(msg), ok }; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2600); render(); }
  function act(r) { if (r) toast(r.msg, r.ok); if (r && r.ok) save(); else render(); }

  /* ───────── اجزا ───────── */
  const kv = (a, b) => `<div class="kv"><span>${a}</span><span class="tn">${b}</span></div>`;
  const stat = (l, v) => `<div class="stat"><div class="l">${l}</div><div class="v tn">${v}</div></div>`;
  const bar = (p, cls) => `<div class="bar ${cls || ''}"><i style="width:${clamp(p, 0, 100)}%"></i></div>`;
  const chip = (t, c) => `<span class="chip ${c || ''}">${t}</span>`;
  const stepper = (label, val, a, extra, k) => `<div class="row sp" style="padding:8px 0"><div class="grow"><div style="font-weight:700">${label}</div>${extra ? `<div class="note">${extra}</div>` : ''}</div><div class="step"><button data-a="${a}" data-d="1"${k ? ` data-k="${k}"` : ''} aria-label="افزایش">+</button><b class="tn">${val}</b><button data-a="${a}" data-d="-1"${k ? ` data-k="${k}"` : ''} aria-label="کاهش">−</button></div></div>`;

  function topbar(title, back) { return `<div class="top"><button class="iconbtn" data-a="${back || 'home'}" aria-label="بازگشت">➜</button><h2>${title}</h2></div>`; }
  function screen(title, body, tabs, tabKey) {
    return `<div class="top"><button class="iconbtn" data-a="go" data-v="game" aria-label="بازگشت">➜</button><h2>${title}</h2><button class="iconbtn" data-a="menu" aria-label="منو">☰</button></div>
      ${tabs ? `<div class="tabs" role="tablist" style="padding:0 16px 8px">${tabs.map((t) => `<button class="tab ${S.tab[tabKey] === t[0] ? 'on' : ''}" role="tab" data-a="tab" data-k="${tabKey}" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>` : ''}
      <div class="scroll"><div class="view stack">${body}</div></div>`;
  }

  /* ───────── صفحه شروع ───────── */
  function splash() {
    const saves = S.saves.slice(0, 5);
    return `<div class="splash"><div class="seal pulse">🏛️</div><h1 class="logo">PRES<span>I</span>DENT</h1>
      <p class="sub" style="text-align:center;margin:0 0 6px">شبیه‌ساز ریاست‌جمهوری و مدیریت کشور</p>
      ${saves.length ? `<button class="btn pri" data-a="load" data-id="${esc(saves[0].id)}">▶ ادامه بازی — ${esc(saves[0].name)} (ماه ${fa(saves[0].turn + 1)})</button>` : ''}
      <button class="btn ${saves.length ? '' : 'pri'}" data-a="newgame">🎮 بازی تک‌نفره جدید</button>
      <button class="btn" disabled aria-disabled="true">👥 چندنفره — در نسخه بعد</button>
      ${saves.length > 1 || (saves.length === 1) ? `<div class="h">بازی‌های ذخیره‌شده</div><div class="list">${saves.map((s) => `<div class="item row sp"><div class="grow"><div class="t">${esc(s.name)}</div><div class="note">ماه ${fa(s.turn + 1)} · ${new Date(s.updated).toLocaleDateString('fa-IR')}</div></div><button class="btn sm" data-a="load" data-id="${esc(s.id)}">بارگذاری</button><button class="btn sm bad" data-a="delask" data-id="${esc(s.id)}" aria-label="حذف">🗑</button></div>`).join('')}</div>` : ''}
      <p class="note" style="text-align:center;margin-top:8px">اطلاعات روی همین دستگاه ذخیره می‌شود و با بستن برنامه از بین نمی‌رود.</p></div>`;
  }

  /* ───────── انتخاب کشور ───────── */
  function select() {
    const real = S.selMode === 'real';
    const head = `<div class="top"><button class="iconbtn" data-a="home" aria-label="بازگشت">➜</button><h2>انتخاب کشور</h2></div>
      <div class="tabs" style="padding:0 16px 8px"><button class="tab ${real ? 'on' : ''}" data-a="selmode" data-v="real">🌍 کشور واقعی</button><button class="tab ${!real ? 'on' : ''}" data-a="selmode" data-v="custom">✨ ساخت کشور خیالی</button></div>`;
    if (real) {
      const c = P.COUNTRIES.find((x) => x.id === S.pickId) || P.COUNTRIES[0];
      return head + `<div class="scroll"><div class="view"><div class="cgrid">${P.COUNTRIES.map((x) => `<button class="ccard ${x.id === c.id ? 'on' : ''}" data-a="pick" data-id="${x.id}"><div class="row"><span class="flag" style="font-size:30px">${x.flag}</span><b style="font-size:16px">${x.name}</b></div><div class="note">تولید: ${moneyS(x.gdp)}</div><div class="note">تورم ${fa(x.infl, 1)}٪ · بیکاری ${fa(x.unemp, 1)}٪</div><div class="row"><span class="note">دشواری</span><span class="dots">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= x.diff ? 'on' : ''}"></i>`).join('')}</span></div></button>`).join('')}</div>
        <div class="card" style="margin-top:12px"><h3><span class="flag" style="font-size:24px">${c.flag}</span> ${c.name}</h3><p style="margin:0 0 10px;color:var(--fg2)">${c.desc}</p>
        <div class="grid2">${stat('جمعیت', fa(c.pop) + ' میلیون')}${stat('تولید ناخالص', money(c.gdp))}${stat('بدهی دولت', money(c.debt))}${stat('خزانه', money(c.treasury))}${stat('درآمد مالیاتی', fa(c.tax * 100) + '٪ GDP')}${stat('رضایت مردم', fa(c.appr) + '٪')}</div>
        <div style="margin-top:10px" class="chips">${c.pros.map((p) => chip('＋ ' + p, 'good')).join('')}${c.weak.map((p) => chip('− ' + p, 'bad')).join('')}</div></div></div></div>
        <div class="dock"><button class="btn pri wide" data-a="startreal">شروع ریاست‌جمهوری ${c.name}</button></div>`;
    }
    const cu = S.custom, a = P.ARCHETYPES.find((x) => x.id === cu.arch);
    const prevC = { flagSvg: cu.flag, flag: '🏳️' };
    return head + `<div class="scroll"><div class="view">
      <div class="card row" style="gap:14px">${MAP.flagHTML(prevC, 56)}<div class="grow"><div style="font-size:20px;font-weight:800">${esc(cu.name || 'کشور من')}</div><div class="note">${a.icon} ${a.name} · ${P.SIZES.find((s) => s.id === cu.size).name}</div></div></div>
      <div class="field" style="margin-top:14px"><label for="cname">نام کشور</label><input id="cname" class="input" maxlength="24" placeholder="مثلاً: آتلانتیس" value="${esc(cu.name)}" autocomplete="off"></div>
      <div class="field"><label>الگوی اقتصادی</label><div class="chips">${P.ARCHETYPES.map((x) => `<button class="tab ${x.id === cu.arch ? 'on' : ''}" data-a="cset" data-k="arch" data-v="${x.id}">${x.icon} ${x.name}</button>`).join('')}</div><div class="note">${a.desc} — تولید سرانه حدود ${fa(a.gdpPC)} دلار</div></div>
      <div class="field"><label>اندازه کشور</label><div class="chips">${P.SIZES.map((x) => `<button class="tab ${x.id === cu.size ? 'on' : ''}" data-a="cset" data-k="size" data-v="${x.id}">${x.name} (${fa(x.pop)} میلیون نفر)</button>`).join('')}</div></div>
      <div class="field"><label>موقعیت روی نقشه</label><div class="chips">${P.REGIONS.map((x) => `<button class="tab ${x.id === cu.region ? 'on' : ''}" data-a="cset" data-k="region" data-v="${x.id}">${x.name}</button>`).join('')}</div></div>
      <div class="field"><label>طرح پرچم</label><div class="chips">${P.FLAG_PATTERNS.map((x) => `<button class="tab ${x.id === cu.flag.p ? 'on' : ''}" data-a="cflag" data-k="p" data-v="${x.id}">${x.name}</button>`).join('')}</div></div>
      ${[0, 1, 2].map((i) => `<div class="field"><label>رنگ ${fa(i + 1)}</label><div class="chips">${P.FLAG_COLORS.map((col) => `<button class="sw ${cu.flag.c[i] === col ? 'on' : ''}" style="background:${col}" data-a="cflag" data-k="c${i}" data-v="${col}" aria-label="رنگ ${col}"></button>`).join('')}</div></div>`).join('')}
      </div></div><div class="dock"><button class="btn pri wide" data-a="startcustom">شروع ریاست‌جمهوری</button></div>`;
  }

  /* ───────── داشبورد ───────── */
  function alerts(c) {
    const d = c.d, out = [];
    const mexp = c.m ? c.m.expense : E.fiscal(S.w, c).expense;
    if (c.treasury < mexp * 0.7) out.push(['bad', '💸', 'خزانه کم است؛ در صورت کسری، دولت ناچار به استقراض می‌شود.']);
    if (d.energyRatio < 1) out.push(['bad', '🔌', 'کمبود انرژی! رشد و رضایت در حال افت است؛ نیروگاه بسازید.']);
    if (d.debtRatio > 1.5) out.push(['warn', '📉', 'بدهی دولت از ' + fa(Math.round(d.debtRatio * 100)) + '٪ تولید ناخالص گذشته است.']);
    if (c.infl > c.inf0 + 8) out.push(['warn', '🔥', 'تورم بالاتر از حد قابل تحمل است؛ نرخ بهره یا کسری را مهار کنید.']);
    if (c.appr < 30) out.push(['bad', '😠', 'رضایت مردم خطرناک پایین است؛ خطر برکناری!']);
    if (c.unemp > c.u0 + 3) out.push(['warn', '👷', 'بیکاری به‌طور محسوس بالا رفته است.']);
    if (!c.research.cur && c.tech.length < P.TECHS.length) out.push(['warn', '🔬', 'هیچ پژوهشی در جریان نیست.']);
    return out;
  }
  function game() {
    const w = S.w, c = me(), d = c.d, pv = c.m ? c.m.prev : null;
    const al = alerts(c);
    const offers = w.offers.filter((o) => o.to === c.id).length;
    const tiles = [
      ['econ', '💰', 'مدیریت اقتصاد', 0], ['factory', '🏭', 'ساخت کارخانه', c.projects.filter((p) => P.BDEF[p.def].cat === 'factory').length],
      ['gov', '🏛️', 'دولت و وزیران', 0], ['foreign', '🌍', 'روابط خارجی', offers],
      ['news', '📰', 'اخبار کشور', 0], ['tech', '🚀', 'تحقیق و فناوری', c.research.cur ? 0 : 1],
      ['map', '🗺️', 'نقشه جهان', 0], ['infra', '🏗️', 'مدیریت زیرساخت‌ها', c.projects.filter((p) => P.BDEF[p.def].cat === 'infra').length],
    ];
    const next = w.pending.length;
    return `<div class="hero"><div class="brand"><button class="iconbtn" data-a="menu" aria-label="منو">☰</button><span>🏛️ PRES<b>I</b>DENT</span><span style="width:38px"></span></div>
      <div class="country">${MAP.flagHTML(c, 46)}<div class="grow"><h1>${esc(c.name)}</h1></div></div><div class="sub">${dateStr(w, c)}</div></div>
      <div class="scroll"><div class="view stack">
      <div class="kpis">
        <div class="kpi"><div class="l">💰 خزانه</div><div class="v tn">${money(c.treasury)}</div><div class="d">${delta(c.treasury, pv && pv.treasury, 1, true, '')}</div></div>
        <div class="kpi"><div class="l">📈 تولید ناخالص (GDP)</div><div class="v tn">${money(c.gdp)}</div><div class="d">${deltaPct(c.gdp, pv && pv.gdp, true)}</div></div>
        <div class="kpi"><div class="l">🔥 نرخ تورم</div><div class="v tn ${c.infl > c.inf0 + 8 ? 'dn' : ''}">${fa(c.infl, 1)}٪</div><div class="d">${delta(c.infl, pv && pv.infl, 1, false, '٪')}</div></div>
        <div class="kpi"><div class="l">👷 نرخ بیکاری</div><div class="v tn">${fa(c.unemp, 1)}٪</div><div class="d">${delta(c.unemp, pv && pv.unemp, 1, false, '٪')}</div></div>
        <div class="kpi"><div class="l">😊 رضایت مردم</div><div class="v tn ${c.appr < 30 ? 'dn' : ''}">${fa(c.appr)}٪</div><div class="d">${delta(c.appr, pv && pv.appr, 1, true, '٪')}</div></div>
        <div class="kpi"><div class="l">🏦 بدهی دولت</div><div class="v tn">${money(c.debt)}</div><div class="d"><span class="mut">${fa(Math.round(d.debtRatio * 100))}٪ تولید ناخالص</span></div></div>
      </div>
      <div class="cashrow"><div class="cash in"><div class="note">درآمد ماهانه</div><div class="up tn" style="font-weight:800;font-size:17px">${money(c.m ? c.m.income : E.fiscal(w, c).income)}</div></div><div class="cash out"><div class="note">هزینه ماهانه</div><div class="dn tn" style="font-weight:800;font-size:17px">${money(c.m ? c.m.expense : E.fiscal(w, c).expense)}</div></div></div>
      <div class="card"><div class="row sp"><h3 style="margin:0">روند تولید ناخالص</h3>${chip('ارزش پول: ' + fa(c.cur, 0), c.cur < 90 ? 'bad' : c.cur > 105 ? 'good' : '')}</div>${line(c.hist.gdp, { fmt: (v) => moneyS(v), label: 'روند GDP' })}</div>
      ${al.length ? `<div class="card"><h3>⚠️ هشدارها</h3>${al.map((a) => `<div class="row" style="padding:5px 0;align-items:flex-start"><span>${a[1]}</span><span class="${a[0] === 'bad' ? 'dn' : 'warn'}" style="font-size:13.5px">${a[2]}</span></div>`).join('')}</div>` : ''}
      <div class="h" style="font-size:16px;color:var(--fg)">چه کاری انجام می‌دهی؟</div>
      <div class="tiles">${tiles.map((t) => `<button class="tile" data-a="go" data-v="${t[0]}"><span class="ic">${t[1]}</span>${t[2]}${t[3] ? `<span class="bd ${t[0] === 'foreign' || t[0] === 'tech' ? '' : 'b'}">${fa(t[3])}</span>` : ''}</button>`).join('')}</div>
      </div></div>
      <div class="dock"><button class="btn pri endturn" data-a="end">${next ? '⚡ رویداد در انتظار تصمیم' : '⏭ پایان ماه ' + fa(w.turn + 1)}</button></div>`;
  }

  /* ───────── اقتصاد ───────── */
  const REVN = { tax: 'مالیات', oil: 'درآمد انرژی', other: 'سایر درآمدها', state: 'درآمد پروژه‌های دولتی', tariff: 'درآمد تعرفه' };
  function econ() {
    const w = S.w, c = me(), d = c.d, F = E.fiscal(w, c), tab = S.tab.econ || 'ov', g = c.gdp / 12;
    let b = '';
    if (tab === 'ov') {
      b = `<div class="card"><h3>شاخص‌های کلیدی</h3>${kv('تولید ناخالص (سالانه)', money(c.gdp))}${kv('رشد سالانه', sgn(c.m ? c.m.growthAnn : c.g0, 1) + '٪')}${kv('تولید داخلی', money(d.prod))}${kv('مصرف داخلی', money(d.cons) + ' (' + fa(d.consShare * 100) + '٪)')}${kv('صادرات', money(d.X))}${kv('واردات', money(d.M))}${kv('تراز تجاری', `<span class="${d.net >= 0 ? 'up' : 'dn'}">${money(d.net)}</span>`)}${kv('ارزش پول ملی', fa(c.cur, 1) + ' (پایه ۱۰۰)')}${kv('نرخ بهره بانک مرکزی', fa(c.policy, 1) + '٪')}</div>
      ${chartCard('📈 تولید ناخالص', c.hist.gdp, { fmt: moneyS })}${chartCard('🔥 تورم (٪)', c.hist.infl, { color: 'var(--warn)' })}${chartCard('👷 بیکاری (٪)', c.hist.unemp, { color: 'var(--bad)' })}${chartCard('😊 رضایت مردم (٪)', c.hist.appr, { color: 'var(--good)', fmt: (v) => fa(v) })}${chartCard('💰 خزانه', c.hist.treasury, { color: 'var(--gold)', fmt: moneyS })}${chartCard('🏦 بدهی دولت', c.hist.debt, { color: 'var(--bad)', fmt: moneyS })}${chartCard('💱 ارزش پول', c.hist.cur, { color: 'var(--accent)', fmt: (v) => fa(v) })}`;
    } else if (tab === 'fis') {
      const taxBase = Math.round(c.tax0 * 1000) / 10;
      b = `<div class="card"><h3>🧾 مالیات</h3>${stepper('نرخ مالیات (درصد تولید ناخالص)', fa(c.tax * 100, 1) + '٪', 'tax', 'پایه: ' + fa(taxBase, 1) + '٪ — بیشتر = درآمد بیشتر، رضایت و مصرف کمتر')}</div>
      <div class="card"><h3>درآمدهای ماهانه</h3>${Object.keys(F.rev).map((k) => kv(REVN[k], money(F.rev[k]))).join('')}${kv('<b>جمع درآمد</b>', `<b class="up">${money(F.income)}</b>`)}<div class="note">وصول مالیات: ${fa(F.coll * 100)}٪ (به وزیر اقتصاد و فناوری وابسته است)</div></div>
      <div class="card"><h3>بودجه و هزینه‌ها (درصد تولید ناخالص سالانه)</h3>${P.BUDGET.map((x) => stepper(x.icon + ' ' + x.name, fa(c.bud[x.id], 2) + '٪', 'bud', money((g * c.bud[x.id]) / 100) + ' در ماه — ' + x.note, x.id)).join('')}
      ${kv('اداری و عمومی (ثابت)', money(F.exp.admin))}${kv('بهره بدهی', money(F.exp.interest))}${kv('نگهداری پروژه‌ها', money(F.exp.upkeep))}${kv('<b>جمع هزینه ماهانه</b>', `<b class="dn">${money(F.expense)}</b>`)}</div>
      <div class="card"><h3>تراز ماهانه</h3><div class="row sp"><span>${F.balance >= 0 ? 'مازاد' : 'کسری'}</span><b class="tn ${F.balance >= 0 ? 'up' : 'dn'}" style="font-size:20px">${money(F.balance)}</b></div><div class="note" style="margin-top:6px">کسری سالانه ≈ ${fa((-F.balance * 12 / c.gdp) * 100, 1)}٪ تولید ناخالص. بودجه سالانه (از ابتدای سال): درآمد ${money(c.ytd.rev)} · هزینه ${money(c.ytd.exp)}</div></div>`;
    } else if (tab === 'bank') {
      b = `<div class="card"><h3>🏦 بانک مرکزی</h3>${stepper('نرخ بهره', fa(c.policy, 1) + '٪', 'policy', 'نرخ بالاتر تورم را کم می‌کند ولی رشد را می‌کاهد و بهره بدهی را زیاد می‌کند')}${kv('هزینه بهره بدهی', fa(d.govRate, 2) + '٪ سالانه')}${kv('ارزش پول', fa(c.cur, 1))}</div>
      <div class="card"><h3>💳 بدهی دولت</h3>${kv('بدهی', money(c.debt))}${kv('نسبت به تولید ناخالص', `<span class="${d.debtRatio > 1.5 ? 'dn' : ''}">${fa(d.debtRatio * 100)}٪</span>`)}${kv('بهره ماهانه', money(F.exp.interest))}
      <div class="grid2" style="margin-top:10px"><button class="btn" data-a="loan" data-p="1">دریافت وام ${fa(1)}٪ GDP<br><span class="note">${money(c.gdp * 0.01)}</span></button><button class="btn" data-a="loan" data-p="3">دریافت وام ${fa(3)}٪ GDP<br><span class="note">${money(c.gdp * 0.03)}</span></button><button class="btn" data-a="repay" data-p="1">بازپرداخت ${fa(1)}٪ GDP</button><button class="btn" data-a="repay" data-p="3">بازپرداخت ${fa(3)}٪ GDP</button></div>
      <p class="note">وام، خزانه را پر می‌کند ولی بدهی و بهره آینده را زیاد می‌کند. در بدهی بسیار سنگین، چاپ پول برای جبران کسری تورم را شعله‌ور می‌کند و ورشکستگی (بدهی بیش از ${fa(350)}٪ GDP) بازی را پایان می‌دهد.</p></div>`;
    } else {
      const maxV = Math.max(1, ...d.partners.map((p) => p.v));
      b = `<div class="card"><h3>🚢 تجارت خارجی</h3>${kv('صادرات', money(d.X))}${kv('واردات', money(d.M))}${kv('تراز', `<span class="${d.net >= 0 ? 'up' : 'dn'}">${money(d.net)} (${sgn(d.netRatio * 100, 1)}٪ GDP)</span>`)}${kv('حجم تجارت با شرکا', money(d.tradeVol))}${kv('درآمد تعرفه (سالانه)', money(d.tariffRev))}</div>
      <div class="card"><h3>شرکای تجاری</h3>${d.partners.length ? d.partners.sort((a, b) => b.v - a.v).map((p) => { const o = w.countries[p.id]; return `<div style="padding:6px 0"><div class="row sp"><span class="row">${MAP.flagHTML(o, 22)} ${esc(o.name)}</span><span class="tn note">${money(p.v)}</span></div>${bar((p.v / maxV) * 100)}</div>`; }).join('') : '<div class="empty note">توافق تجاری ندارید. در بخش روابط خارجی توافق امضا کنید.</div>'}</div>
      <div class="card"><h3>⚡ انرژی</h3><div class="row sp"><span>عرضه به تقاضا</span><b class="tn ${d.energyRatio < 1 ? 'dn' : 'up'}">${fa(d.energyRatio * 100)}٪</b></div>${bar(d.energyRatio * 80, d.energyRatio < 1 ? 'r' : 'g')}<p class="note">قیمت جهانی انرژی اکنون ${fa(w.energyPrice, 2)} برابر حالت پایه است. زیر ۱۰۰٪ یعنی کمبود برق و افت رشد.</p></div>`;
    }
    return screen('مدیریت اقتصاد', b, [['ov', 'نمای کلی'], ['fis', 'مالیات و بودجه'], ['bank', 'بانک و بدهی'], ['trade', 'تجارت و انرژی']], 'econ');
  }

  /* ───────── ساخت‌وساز ───────── */
  function buildScreen(cat, title) {
    const c = me(), tab = S.tab[cat] || 'new', sc = c.scale, jobScale = Math.pow(c.pop / 100, 0.9);
    const defs = P.BUILDINGS.filter((b) => b.cat === cat);
    const projs = c.projects.filter((p) => P.BDEF[p.def].cat === cat), owned = c.buildings.filter((b) => P.BDEF[b.def].cat === cat);
    let b = '';
    if (cat === 'infra' && tab === 'new') b += infraLevels(c);
    if (tab === 'new') {
      b += `<div class="list">${defs.map((d) => { const cost = E.buildCost(c, d.id), afford = c.treasury >= cost; return `<div class="item"><div class="row"><span style="font-size:30px">${d.icon}</span><div class="grow"><div class="t">${d.name}</div><div class="note">${d.desc}</div></div></div>
        <div class="grid2" style="margin-top:8px">${stat('هزینه ساخت', money(cost))}${stat('زمان تکمیل', fa(d.months) + ' ماه')}${stat('نگهداری ماهانه', money(d.up * sc))}${stat('درآمد ماهانه دولت', money(d.rev * sc))}${stat('افزایش تولید (سالانه)', money(d.out * sc))}${stat('اشتغال', fa(d.jobs * jobScale, 0) + ' هزار نفر')}</div>
        ${d.lv ? `<div class="note" style="margin-top:6px">اثر: ${Object.keys(d.lv).map((k) => ({ infra: 'زیرساخت', health: 'سلامت', edu: 'آموزش' }[k]) + ' +' + fa(d.lv[k] * clamp(1.2 / sc, 0.25, 1.5), 1)).join('، ')}</div>` : ''}
        ${d.energy ? `<div class="note">تأمین انرژی: ${money(d.energy * sc)} معادل تقاضا</div>` : ''}
        <button class="btn pri sm" style="margin-top:10px;width:100%" data-a="build" data-id="${d.id}" ${afford ? '' : 'disabled'}>${afford ? 'شروع ساخت' : 'خزانه کافی نیست'}</button></div>`; }).join('')}</div>`;
    } else if (tab === 'proj') {
      b += projs.length ? `<div class="list">${projs.map((p) => { const d = P.BDEF[p.def]; return `<div class="item"><div class="row sp"><div class="row"><span style="font-size:26px">${d.icon}</span><div><div class="t">${d.name}</div><div class="note">${fa(p.left)} ماه تا تکمیل</div></div></div><button class="btn sm bad" data-a="cancel" data-uid="${p.uid}">لغو</button></div><div style="margin-top:8px">${bar(((p.total - p.left) / p.total) * 100)}</div></div>`; }).join('')}</div><p class="note">لغو پروژه ۳۰٪ هزینه را برمی‌گرداند.</p>` : '<div class="empty">پروژه در حال ساختی نیست.</div>';
    } else {
      b += owned.length ? `<div class="list">${owned.map((x) => { const d = P.BDEF[x.def]; return `<div class="item"><div class="row sp"><div class="row"><span style="font-size:26px">${d.icon}</span><div><div class="t">${d.name}</div><div class="note">${x.active ? chip('فعال', 'good') : chip('تعطیل', 'warn')} · ساخت در ماه ${fa(x.built + 1)}</div></div></div><div class="row"><button class="btn sm" data-a="toggle" data-uid="${x.uid}">${x.active ? 'تعطیل' : 'فعال‌سازی'}</button><button class="btn sm bad" data-a="sell" data-uid="${x.uid}">فروش</button></div></div></div>`; }).join('')}</div><p class="note">فروش، ۴۰٪ هزینه ساخت را برمی‌گرداند. تعطیل‌کردن هزینه نگهداری را حذف می‌کند ولی تولید و اشتغال هم متوقف می‌شود.</p>` : '<div class="empty">هنوز پروژه‌ای ساخته نشده است.</div>';
    }
    return screen(title, b, [['new', 'ساخت جدید'], ['proj', `در حال ساخت (${fa(projs.length)})`], ['own', `ساخته‌شده (${fa(owned.length)})`]], cat);
  }
  function infraLevels(c) {
    const e = c.d.eff, L = [['health', '⚕️', 'سلامت'], ['edu', '🎓', 'آموزش'], ['infra', '🛣️', 'زیرساخت'], ['sec', '🛡️', 'امنیت']];
    return `<div class="card"><h3>سطح خدمات و زیرساخت</h3>${L.map((l) => `<div class="lv"><span>${l[1]} ${l[2]}</span>${bar(e[l[0]], e[l[0]] < 40 ? 'r' : e[l[0]] < 60 ? 'y' : 'g')}<b class="tn">${fa(e[l[0]])}</b></div>`).join('')}
      <div class="lv"><span>⚡ انرژی</span>${bar(c.d.energyRatio * 80, c.d.energyRatio < 1 ? 'r' : 'g')}<b class="tn">${fa(c.d.energyRatio * 100)}٪</b></div>
      <p class="note">سطح خدمات با بودجه همان بخش (در «مدیریت اقتصاد») و پروژه‌ها تغییر می‌کند.</p></div>`;
  }

  /* ───────── دولت ───────── */
  const MEFF = { economy: 'وصول مالیات و تورم', industry: 'بهره‌وری و هزینه ساخت', defense: 'امنیت', foreign: 'سرعت بهبود روابط و تجارت', interior: 'رضایت و ثبات', energy: 'عرضه انرژی', education: 'سطح آموزش', health: 'سطح سلامت' };
  function gov() {
    const c = me(), m = c.ministers;
    const b = `<p class="note" style="margin:0 2px">مهارت بالا کارآمدی را زیاد می‌کند؛ درستکاری پایین ریسک فساد و رسوایی را بالا می‌برد.</p>` + P.MINISTRIES.map((k) => {
      const x = m[k.id], ef = Math.round(E.effic(x) * 100), open = S.openMin === k.id;
      return `<div class="item"><div class="row"><span style="font-size:28px">${k.icon}</span><div class="grow"><div class="note">${k.name}</div><div class="t">${esc(x.name)}</div><div class="note">${x.trait} · اثر بر ${MEFF[k.id]}</div></div><div style="text-align:center"><div class="tn" style="font-weight:800;color:${ef >= 100 ? 'var(--good)' : ef < 80 ? 'var(--bad)' : 'var(--warn)'}">${fa(ef)}٪</div><div class="note">کارآمدی</div></div></div>
      <div class="lv" style="grid-template-columns:70px 1fr 30px"><span class="note">مهارت</span>${bar(x.skill)}<b class="tn">${fa(x.skill)}</b></div><div class="lv" style="grid-template-columns:70px 1fr 30px"><span class="note">درستکاری</span>${bar(x.integrity, x.integrity < 45 ? 'r' : 'g')}<b class="tn">${fa(x.integrity)}</b></div>
      <button class="btn sm" style="width:100%;margin-top:6px" data-a="openmin" data-m="${k.id}">${open ? 'بستن' : 'تغییر وزیر'}</button>
      ${open ? `<div style="margin-top:10px" class="list">${c.candidates[k.id].map((cd) => { const cost = E.hireCost(c, cd); return `<div class="card" style="box-shadow:none;background:var(--card2)"><div class="row sp"><div><div class="t">${esc(cd.name)}</div><div class="note">${cd.trait} · مهارت ${fa(cd.skill)} · درستکاری ${fa(cd.integrity)} · کارآمدی ${fa(Math.round(E.effic(cd) * 100))}٪</div></div><button class="btn pri sm" data-a="hire" data-m="${k.id}" data-c="${cd.id}">انتصاب<br><span style="font-size:11px">${money(cost)}</span></button></div></div>`; }).join('')}<button class="btn sm" data-a="refc" data-m="${k.id}">🔄 معرفی گزینه‌های جدید (${money(0.05 * c.scale)})</button></div>` : ''}</div>`;
    }).join('');
    return screen('دولت و وزیران', b);
  }

  /* ───────── تحقیق ───────── */
  function tech() {
    const c = me(), cur = c.research.cur ? P.TECH[c.research.cur] : null;
    const b = `<div class="card"><h3>🔬 پژوهش جاری</h3>${cur ? `<div class="row"><span style="font-size:28px">${cur.icon}</span><div class="grow"><div class="t">${cur.name}</div><div class="note">${cur.desc}</div></div></div><div style="margin:10px 0 4px">${bar((c.research.progress / cur.cost) * 100)}</div><div class="note tn">${fa(c.research.progress, 0)} از ${fa(cur.cost)} امتیاز — سرعت: ${fa(c.rpRate || 0, 1)} امتیاز در ماه</div>` : `<div class="empty note" style="padding:10px">پژوهشی انتخاب نشده است. یک فناوری برگزینید.</div><div class="note tn">سرعت: ${fa(c.rpRate || c.bud.research * 10 * 0.8 * 0.1, 1)} امتیاز در ماه</div>`}<p class="note">سرعت پژوهش به بودجه «تحقیق و فناوری»، سطح آموزش و تعداد دانشگاه‌ها بستگی دارد.</p></div>
      <div class="list">${P.TECHS.map((t) => {
        const done = c.tech.includes(t.id), ready = t.req.every((r) => c.tech.includes(r)), active = c.research.cur === t.id;
        return `<div class="item" style="${done ? 'opacity:.75' : ''}"><div class="row"><span style="font-size:26px">${t.icon}</span><div class="grow"><div class="t">${t.name} ${done ? chip('فعال', 'good') : active ? chip('در حال پژوهش', 'acc') : ''}</div><div class="note">${t.desc}</div>${t.req.length ? `<div class="note">پیش‌نیاز: ${t.req.map((r) => (c.tech.includes(r) ? '✅ ' : '🔒 ') + P.TECH[r].name).join('، ')}</div>` : ''}</div></div>
        ${done ? '' : `<div class="row sp" style="margin-top:8px"><span class="note tn">هزینه: ${fa(t.cost)} امتیاز</span><button class="btn sm ${ready ? 'pri' : ''}" data-a="research" data-id="${t.id}" ${ready && !active ? '' : 'disabled'}>${active ? 'در حال پژوهش' : ready ? 'شروع پژوهش' : 'قفل'}</button></div>`}</div>`;
      }).join('')}</div>`;
    return screen('تحقیق و فناوری', b);
  }

  /* ───────── اخبار ───────── */
  function newsScr() {
    const w = S.w, c = me(), t = S.newsTab;
    const list = w.news.filter((n) => (t === 'mine' ? n.cid === c.id : t === 'world' ? !n.cid || n.cid !== c.id : true)).slice(0, 60);
    const b = `<div class="tabs"><button class="tab ${t === 'all' ? 'on' : ''}" data-a="newstab" data-v="all">همه</button><button class="tab ${t === 'mine' ? 'on' : ''}" data-a="newstab" data-v="mine">کشور من</button><button class="tab ${t === 'world' ? 'on' : ''}" data-a="newstab" data-v="world">جهان</button></div>
      <div class="card">${list.length ? list.map((n) => `<div class="news ${n.tone}"><i></i><div class="grow"><div class="t">${esc(pd(n.title))}</div>${n.text ? `<div class="x">${esc(pd(n.text))}</div>` : ''}<div class="note">${P.MONTHS[n.turn % 12]} ${faY(w.startYear + Math.floor(n.turn / 12))}${n.cid ? ' · ' + esc(w.countries[n.cid].name) : ''}</div></div></div>`).join('') : '<div class="empty">خبری نیست.</div>'}</div>`;
    return screen('اخبار کشور', b);
  }

  /* ───────── روابط خارجی و نقشه ───────── */
  function dipDetail(id) {
    const w = S.w, c = me(), o = w.countries[id]; if (!o || o.id === c.id) return '';
    const p = E.ensurePact(w, c.id, id), lvl = E.pactLevel(p), rel = E.getRel(w, c.id, id);
    const part = c.d.partners.find((x) => x.id === id);
    const nxt = lvl < 4 ? E.LEVELS[lvl + 1] : null;
    const cost = (k) => money(DIPCOST[k] * c.scale);
    return `<div class="card"><div class="row">${MAP.flagHTML(o, 40)}<div class="grow"><div style="font-size:19px;font-weight:800">${esc(o.name)}</div><div class="note">${o.owner ? 'بازیکن' : 'هوش مصنوعی'} · ${LVL[lvl]}${p.sanction ? ' · تحریم‌شده' : ''}${p.rival ? ' · رقیب اقتصادی' : ''}</div></div></div>
      <div style="margin:10px 0 4px"><div class="row sp"><span class="note">میزان روابط</span><b class="tn" style="color:${relColor(rel)}">${sgn(Math.round(rel))}</b></div><div class="bar"><i style="width:${(rel + 100) / 2}%;background:${relColor(rel)}"></i></div></div>
      <div class="grid2" style="margin:10px 0">${stat('GDP', money(o.gdp))}${stat('تورم', fa(o.infl, 1) + '٪')}${stat('بیکاری', fa(o.unemp, 1) + '٪')}${stat('جمعیت', fa(o.pop) + ' م')}${stat('تجارت با شما', part ? money(part.v) : '—')}${stat('متحدان', fa(E.alliesOf(w, id).length))}</div>
      <div class="list">
        ${nxt ? `<button class="btn pri" style="width:100%" data-a="dip" data-t="${id}" data-x="${nxt}">${E.TYPE_NAME[nxt]} <span class="note" style="color:inherit;opacity:.85">(${cost(nxt)} · حداقل روابط ${fa(E.REQ[nxt])})</span></button>` : ''}
        <div class="grid2"><button class="btn" data-a="dip" data-t="${id}" data-x="improve">🤝 بهبود روابط<br><span class="note">${cost('improve')}</span></button><button class="btn" data-a="dip" data-t="${id}" data-x="reduce">😠 کاهش روابط</button>
        ${lvl >= 2 ? `<button class="btn" data-a="dip" data-t="${id}" data-x="tariff">${p.tariff.includes(c.id) ? 'برداشتن تعرفه' : '🛃 اعمال تعرفه'}</button>` : ''}
        ${lvl >= 1 ? `<button class="btn" data-a="dip" data-t="${id}" data-x="sanction">${p.sanction ? 'لغو تحریم' : '⛔ تحریم'}</button>` : ''}
        <button class="btn" data-a="dip" data-t="${id}" data-x="rival">${p.rival ? 'پایان رقابت' : '⚔️ رقابت اقتصادی'}</button>
        ${lvl >= 1 ? `<button class="btn bad" data-a="dip" data-t="${id}" data-x="cancel">کاهش سطح همکاری</button>` : ''}</div></div>
      <p class="note">هر سطح همکاری نیازمند سطح قبلی و میزان روابط کافی است. تجارت و اتحاد روی رشد، صادرات و روابط با سایر کشورها اثر می‌گذارد.</p></div>`;
  }
  function foreign() {
    const w = S.w, c = me();
    const offers = w.offers.filter((o) => o.to === c.id);
    const ids = Object.keys(w.countries).filter((i) => i !== c.id).sort((a, b) => w.countries[b].gdp - w.countries[a].gdp);
    if (!S.dipSel || S.dipSel === c.id) S.dipSel = null;
    const b = (offers.length ? `<div class="card"><h3>📨 پیشنهادهای دریافتی</h3>${offers.map((o) => `<div class="row sp" style="padding:6px 0"><div class="row">${MAP.flagHTML(w.countries[o.from], 26)}<div><div class="t">${esc(w.countries[o.from].name)}</div><div class="note">${E.TYPE_NAME[o.type]} · ${fa(o.exp - w.turn)} ماه اعتبار</div></div></div><div class="row"><button class="btn pri sm" data-a="offer" data-id="${o.id}" data-ok="1">بپذیر</button><button class="btn sm" data-a="offer" data-id="${o.id}" data-ok="0">رد</button></div></div>`).join('')}</div>` : '')
      + (S.dipSel ? `<button class="btn sm" data-a="dipsel" data-id="">⬅ فهرست کشورها</button>${dipDetail(S.dipSel)}` :
        `<div class="list">${ids.map((id) => { const o = w.countries[id], p = E.ensurePact(w, c.id, id), rel = E.getRel(w, c.id, id); return `<button class="item" style="width:100%;text-align:right" data-a="dipsel" data-id="${id}"><div class="row">${MAP.flagHTML(o, 32)}<div class="grow"><div class="row sp"><span class="t">${esc(o.name)}</span><span class="note">${LVL[E.pactLevel(p)]}${p.sanction ? ' · ⛔' : ''}${p.rival ? ' · ⚔️' : ''}</span></div><div class="bar" style="margin-top:6px"><i style="width:${(rel + 100) / 2}%;background:${relColor(rel)}"></i></div></div><b class="tn" style="color:${relColor(rel)};min-width:34px;text-align:left">${sgn(Math.round(rel))}</b></div></button>`; }).join('')}</div>`);
    return screen('روابط خارجی', b);
  }
  const MKOFF = { FRA: [-14, 6, 'end'], DEU: [13, -6, 'start'], TUR: [-14, 8, 'end'], SAU: [0, 30, 'middle'], IRN: [15, 8, 'start'], IND: [0, 30, 'middle'], CHN: [0, -16, 'middle'], JPN: [-14, 8, 'end'] };
  function mapScr() {
    const w = S.w, c = me();
    const sel = S.dipSel;
    const mk = Object.keys(w.countries).map((id) => {
      const o = w.countries[id], x = MAP.px(o.lon), y = MAP.py(o.lat), rel = id === c.id ? 100 : E.getRel(w, c.id, id), self = id === c.id;
      const ally = id !== c.id && E.pactLevel(E.ensurePact(w, c.id, id)) === 4, off = MKOFF[id] || [0, -12, 'middle'];
      return `<g class="mk" data-a="mapsel" data-id="${id}" role="button" aria-label="${esc(o.name)}" tabindex="0"><circle cx="${x}" cy="${y}" r="22" fill="transparent"/>${sel === id ? `<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="var(--fg)" stroke-width="2.5"/>` : ''}${ally ? `<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="var(--good)" stroke-width="2"/>` : ''}<circle cx="${x}" cy="${y}" r="${self ? 12 : 10}" fill="${self ? 'var(--gold)' : relColor(rel)}" stroke="var(--sea)" stroke-width="2.5"/><text x="${x + off[0]}" y="${y + off[1]}" text-anchor="${off[2]}">${esc(o.name)}</text></g>`;
    }).join('');
    const b = `<div class="mapbox mapscroll" id="mapscroll"><svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="نقشه جهان"><path class="land" d="${MAP.dots()}"/>${mk}</svg></div>
      <div class="note" style="margin-top:6px">نقشه را به چپ و راست بکشید.</div><div class="legend"><span><i style="background:var(--gold)"></i>کشور شما</span><span><i style="background:var(--good)"></i>دوست</span><span><i style="background:var(--fg3)"></i>خنثی</span><span><i style="background:var(--warn)"></i>تنش</span><span><i style="background:var(--bad)"></i>خصومت</span></div>
      ${sel && sel !== c.id ? dipDetail(sel) : '<div class="empty note">روی یک کشور بزنید تا اطلاعات و کنش‌های دیپلماتیک آن را ببینید.</div>'}`;
    return screen('نقشه جهان', b);
  }

  /* ───────── پنجره‌ها ───────── */
  function modal() {
    const m = S.modal; if (!m) return '';
    const w = S.w, c = w && me();
    if (m.t === 'report') {
      const r = m.r;
      return `<div class="scrim" role="dialog" aria-modal="true"><div class="sheet"><div class="grab"></div><h2>📋 گزارش ماه ${fa(r.turn)}</h2><div class="note">${P.MONTHS[(r.turn - 1) % 12]} ${faY(w.startYear + Math.floor((r.turn - 1) / 12))}</div>
        <div class="card" style="margin-top:10px">${kv('درآمد', `<span class="up">${money(r.income)}</span>`)}${kv('هزینه', `<span class="dn">${money(r.expense)}</span>`)}${kv('تراز ماه', `<b class="${r.balance >= 0 ? 'up' : 'dn'}">${money(r.balance)}</b>`)}${kv('رشد GDP در ماه', `<span class="${r.dGdpPct >= 0 ? 'up' : 'dn'}">${sgn(r.dGdpPct, 2)}٪</span>`)}${kv('تورم', `${fa(r.infl, 1)}٪ (${sgn(r.dInfl, 1)})`)}${kv('بیکاری', `${fa(r.unemp, 1)}٪ (${sgn(r.dUnemp, 1)})`)}${kv('رضایت مردم', `${fa(r.appr)}٪ (${sgn(r.dAppr, 1)})`)}${kv('ارزش پول', `${sgn(r.dCur, 1)}٪`)}</div>
        ${r.emergency > 0 ? `<div class="err" style="margin:10px 0">⚠️ خزانه خالی شد و ${money(r.emergency)} استقراض اضطراری انجام شد.</div>` : ''}
        ${m.el ? `<div class="card" style="margin-top:10px"><h3>🗳️ انتخابات</h3><p style="margin:0">${m.el.won ? `شما با ${fa(m.el.share)}٪ رأی پیروز شدید و دور جدید ریاست‌جمهوری آغاز شد.` : `با ${fa(m.el.share)}٪ رأی شکست خوردید.`}</p></div>` : ''}
        ${r.news.length ? `<div class="h">رویدادهای این ماه</div><div class="card">${r.news.map((n) => `<div class="news ${n.tone}"><i></i><div><div class="t">${esc(pd(n.title))}</div>${n.text ? `<div class="x">${esc(pd(n.text))}</div>` : ''}</div></div>`).join('')}</div>` : ''}
        <button class="btn pri" style="width:100%;margin-top:14px" data-a="closereport">ادامه</button></div></div>`;
    }
    if (m.t === 'event') {
      const pe = w.pending[0]; if (!pe) return '';
      const ev = P.COUNTRY_EVENTS.find((e) => e.id === pe.ev), cc = w.countries[pe.cid];
      return `<div class="scrim" role="dialog" aria-modal="true"><div class="sheet"><div class="grab"></div><h2>⚡ ${ev.title}</h2><p style="color:var(--fg2);margin:6px 0 14px">${ev.text}</p><div class="list">${ev.choices.map((ch, i) => `<button class="btn" style="width:100%;text-align:right" data-a="choice" data-id="${pe.id}" data-i="${i}"><div class="t">${ch.label}</div><div class="note">${pd(ch.desc(cc))}</div></button>`).join('')}</div></div></div>`;
    }
    if (m.t === 'over') {
      const o = w.over, T = { impeach: ['😞', 'برکناری از قدرت', 'رضایت مردم چند ماه متوالی به‌شدت پایین بود و مجلس شما را برکنار کرد.'], bankrupt: ['💥', 'ورشکستگی دولت', 'بدهی از ظرفیت کشور فراتر رفت و دولت سقوط کرد.'], election: ['🗳️', 'شکست در انتخابات', 'مردم به شما رأی ندادند.'] }[o.reason];
      return `<div class="scrim" role="dialog" aria-modal="true"><div class="sheet" style="text-align:center"><div style="font-size:54px">${T[0]}</div><h2>${T[1]}</h2><p style="color:var(--fg2)">${T[2]}</p><div class="card">${kv('مدت ریاست‌جمهوری', fa(o.turn) + ' ماه')}${kv('امتیاز نهایی', `<b style="color:var(--gold)">${fa(o.score)}</b>`)}</div><div class="list" style="margin-top:14px"><button class="btn pri" style="width:100%" data-a="newgame">بازی جدید</button><button class="btn" style="width:100%" data-a="home">منوی اصلی</button></div></div></div>`;
    }
    if (m.t === 'menu') {
      const th = document.documentElement.getAttribute('data-theme') || 'dark';
      return `<div class="scrim" data-a="closemodal" role="dialog" aria-modal="true"><div class="sheet" data-stop="1"><div class="grab"></div><h2>منو</h2><div class="list" style="margin-top:12px"><button class="btn" style="width:100%" data-a="savenow">💾 ذخیره بازی</button><button class="btn" style="width:100%" data-a="theme">${th === 'light' ? '🌙 تم تیره' : '☀️ تم روشن'}</button><button class="btn" style="width:100%" data-a="home">🏠 منوی اصلی (ذخیره‌شده)</button><button class="btn" style="width:100%" data-a="closemodal">بستن</button></div><p class="note">بازی بعد از هر اقدام و پایان هر ماه خودکار ذخیره می‌شود. ${P.db.mode === 'fallback' ? '(ذخیره‌سازی جایگزین فعال است)' : ''}</p></div></div>`;
    }
    if (m.t === 'del') {
      return `<div class="scrim" role="dialog" aria-modal="true"><div class="sheet"><h2>حذف بازی؟</h2><p style="color:var(--fg2)">این بازی برای همیشه حذف می‌شود.</p><div class="grid2"><button class="btn bad" data-a="delyes" data-id="${esc(m.id)}">حذف</button><button class="btn" data-a="closemodal">انصراف</button></div></div></div>`;
    }
    return '';
  }

  /* ───────── رندر ───────── */
  function render() {
    const ms0 = $app.querySelector('#mapscroll'); if (ms0) S.mapX = ms0.scrollLeft;
    const sc = $app.querySelector('.scroll'), top = sc ? sc.scrollTop : 0, sameView = $app.dataset.view === S.view + (S.tab[S.view] || '');
    let html;
    try {
      const v = S.view;
      html = v === 'splash' ? splash() : v === 'select' ? select() : v === 'game' ? game() : v === 'econ' ? econ() : v === 'factory' ? buildScreen('factory', 'ساخت کارخانه') : v === 'infra' ? buildScreen('infra', 'مدیریت زیرساخت‌ها') : v === 'gov' ? gov() : v === 'foreign' ? foreign() : v === 'news' ? newsScr() : v === 'tech' ? tech() : v === 'map' ? mapScr() : splash();
      html += modal();
    } catch (e) { console.error(e); html = `<div class="err">خطای نمایش: ${esc(e && e.message || e)}<br><button class="btn" data-a="home">بازگشت به منو</button></div>`; }
    if (S.toast) html += `<div class="toast ${S.toast.ok ? 'good' : 'bad'}" role="status">${esc(S.toast.msg)}</div>`;
    $app.innerHTML = html;
    $app.dataset.view = S.view + (S.tab[S.view] || '');
    const ns = $app.querySelector('.scroll'); if (ns && sameView) ns.scrollTop = top;
    const ms = $app.querySelector('#mapscroll'); if (ms) ms.scrollLeft = S.mapX != null ? S.mapX : Math.max(0, (MAP.px(55) / MAP.W) * ms.scrollWidth - ms.clientWidth / 2);
    const ae = $app.querySelector('#cname'); if (ae && S._focusName) { ae.focus(); const l = ae.value.length; ae.setSelectionRange(l, l); }
  }
  const go = (v) => { if (v === 'map') S.mapX = null; S.view = v; S.dipSel = null; S.openMin = null; S.modal = null; render(); const sc = $app.querySelector('.scroll'); if (sc) sc.scrollTop = 0; };

  /* ───────── کنش‌ها ───────── */
  function afterTurn(res) {
    const w = S.w;
    if (res.blocked) { S.modal = { t: 'event' }; return render(); }
    S.modal = { t: 'report', r: res.reports[0], el: res.election };
    save(); render();
  }
  async function startGame(opts) {
    try {
      S.w = E.newGame(opts); S.tab = {}; S.newsTab = 'all'; S.modal = null; S.view = 'game';
      await saveNow(); S.saves = await P.db.list().catch(() => []); render();
    } catch (e) { toast('خطا در شروع بازی: ' + e.message, false); }
  }
  const H = {
    home: async () => { await saveNow(); S.saves = await P.db.list().catch(() => []); S.w = null; S.modal = null; S.view = 'splash'; render(); },
    go: (d) => go(d.v),
    tab: (d) => { S.tab[d.k] = d.v; render(); },
    newgame: () => { S.view = 'select'; S.modal = null; render(); },
    selmode: (d) => { S.selMode = d.v; render(); },
    pick: (d) => { S.pickId = d.id; render(); const el = $app.querySelector('.ccard.on'); },
    startreal: () => startGame({ countryId: S.pickId }),
    startcustom: () => { if (!S.custom.name.trim()) { return toast('نام کشور را وارد کنید.', false); } startGame({ custom: Object.assign({}, S.custom, { name: S.custom.name.trim() }) }); },
    cset: (d) => { S.custom[d.k] = d.v; S._focusName = false; render(); },
    cflag: (d) => { if (d.k === 'p') S.custom.flag.p = d.v; else S.custom.flag.c[+d.k.slice(1)] = d.v; render(); },
    load: async (d) => { try { const w = await P.db.load(d.id); if (!w) return toast('بازی یافت نشد.', false); S.w = w; S.tab = {}; S.view = 'game'; S.modal = w.over ? { t: 'over' } : w.pending.length ? { t: 'event' } : null; render(); } catch (e) { toast('بارگذاری ناموفق: ' + e.message, false); } },
    delask: (d) => { S.modal = { t: 'del', id: d.id }; render(); },
    delyes: async (d) => { await P.db.remove(d.id).catch(() => {}); S.saves = await P.db.list().catch(() => []); S.modal = null; render(); },
    menu: () => { S.modal = { t: 'menu' }; render(); },
    closemodal: () => { S.modal = null; render(); },
    savenow: async () => { const ok = await saveNow(); S.modal = null; if (ok) toast('بازی ذخیره شد.', true); else render(); },
    theme: () => { const r = document.documentElement, cur = r.getAttribute('data-theme'); const dark = (cur || 'dark') === 'dark'; r.setAttribute('data-theme', dark ? 'light' : 'dark'); try { localStorage.setItem('president:theme', dark ? 'light' : 'dark'); } catch (e) { /* ignore */ } render(); },
    end: () => { if (S.w.over) { S.modal = { t: 'over' }; return render(); } if (S.w.pending.length) { S.modal = { t: 'event' }; return render(); } afterTurn(E.endTurn(S.w)); },
    closereport: () => { S.modal = null; if (S.w.over) S.modal = { t: 'over' }; else if (S.w.pending.length) S.modal = { t: 'event' }; render(); },
    choice: (d) => { const r = A.resolveEvent(S.w, +d.id, +d.i); S.modal = S.w.pending.length ? { t: 'event' } : null; if (r.msg) toast(r.msg, r.ok); save(); render(); },
    tax: (d) => act(A.setTax(S.w, me().id, 0.005 * +d.d)),
    bud: (d) => act(A.setBudget(S.w, me().id, d.k, 0.25 * +d.d)),
    policy: (d) => act(A.setPolicy(S.w, me().id, +d.d)),
    loan: (d) => act(A.loan(S.w, me().id, +d.p)),
    repay: (d) => act(A.repay(S.w, me().id, +d.p)),
    build: (d) => act(A.build(S.w, me().id, d.id)),
    toggle: (d) => act(A.toggleBuilding(S.w, me().id, +d.uid)),
    sell: (d) => act(A.sellBuilding(S.w, me().id, +d.uid)),
    cancel: (d) => act(A.cancelProject(S.w, me().id, +d.uid)),
    openmin: (d) => { S.openMin = S.openMin === d.m ? null : d.m; render(); },
    hire: (d) => { const r = A.hire(S.w, me().id, d.m, d.c); if (r.ok) S.openMin = null; act(r); },
    refc: (d) => act(A.refreshCandidates(S.w, me().id, d.m)),
    research: (d) => act(A.research(S.w, me().id, d.id)),
    dipsel: (d) => { S.dipSel = d.id || null; render(); },
    mapsel: (d) => { S.dipSel = d.id; render(); },
    dip: (d) => act(A.diplomacy(S.w, me().id, d.t, d.x)),
    offer: (d) => act(d.ok === '1' ? A.acceptOffer(S.w, me().id, +d.id) : A.rejectOffer(S.w, me().id, +d.id)),
    newstab: (d) => { S.newsTab = d.v; render(); },
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-a]'); if (!t) return;
    if (e.target.closest('[data-stop]') && t.classList.contains('scrim')) return;
    const fn = H[t.dataset.a]; if (!fn) return;
    try { const r = fn(t.dataset); if (r && r.catch) r.catch((er) => toast('خطا: ' + er.message, false)); } catch (er) { console.error(er); toast('خطا: ' + er.message, false); }
  });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-a]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  document.addEventListener('input', (e) => { if (e.target.id === 'cname') { S.custom.name = e.target.value; S._focusName = true; } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', () => { saveNow(); });
  window.addEventListener('error', (e) => { if (!$app.querySelector('.err')) console.error(e.message); });

  /* ───────── شروع ───────── */
  (async function init() {
    try { const t = localStorage.getItem('president:theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ }
    try { S.saves = await P.db.list(); } catch (e) { S.saves = []; }
    render();
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  })();
  P.ui = { S, render, H };
})();

</script>
</body>
</html>
